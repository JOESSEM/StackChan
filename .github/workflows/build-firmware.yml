name: Build StackChan proactive firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tested base commit and apply proactive patch
        run: |
          cp stackchan-proactive.patch /tmp/stackchan-proactive.patch
          git checkout 1b5765599fba8aaad1811d9a79358ccc7051f5f3
          git apply /tmp/stackchan-proactive.patch
          echo "patch applied"
          git diff --stat

      - name: Fetch firmware dependencies
        working-directory: firmware
        run: python3 fetch_repos.py

      - name: Build with ESP-IDF v5.5.4
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: firmware
          command: idf.py build

      - uses: actions/upload-artifact@v4
        with:
          name: stackchan-proactive-firmware
          path: |
            firmware/build/flash_args
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/stack-chan.bin
            firmware/build/generated_assets.bin
